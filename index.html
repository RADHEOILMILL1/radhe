<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORM...</title>
  <link rel="stylesheet" href="form.css">
</head>

<body>
  <div class="container">
    <form autocomplete="off" method="post" name="google-sheet">
      <h3>RADHE OIL MILL</h3>

      <input type="text" placeholder="Type Your Name Here.... "name="name">
      <input type="email" placeholder="Type Your Email Here...."name="email">
      <input type="text" placeholder="Type Your Number Here...."name="mobile">

      <select name="gender">
        <option value="NOT SELECTED">SELECT OPTION</option>
        <option value="MALE">MALE</option>
        <option value="FEMALE">FEMALE</option>
      </select>

      <textarea rows="4" placeholder="HOW WE CAN HELP YOU?" name="message"></textarea>

      <button type="submit">SEND</button>
      <button type="reset" class="reset">RESET</button>
    </form>
  </div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbybMsPoRDoIakvzfM7BZz137Bi-LeUR9sTIrdlER_U8-uSRODGJu4e47mS6DNUf_ZY/exec'
const form = document.forms['google-sheet']

form.addEventListener('submit', e => {
  e.preventDefault()

  fetch(scriptURL, { method: 'POST', body: new FormData(form)})
    .then(response => {
      alert("Thanks for Contacting us!");

      // ✅ Yaha apna link daalo
      window.location.href = "for.html";

    })
    .catch(error => console.error('Error!', error.message))
})
</script>

</body>
</html>
