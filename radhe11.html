<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }

    img:hover {
      transform: scale(1.07);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 600px) {
      img {
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <img src="img001.jpg" alt="img001">
  <img src="img002.jpg" alt="img002">
  <img src="img003.jpg" alt="img003">
  <img src="img004.jpg" alt="img004">
  <img src="img005.jpg" alt="img005">
  <img src="img006.jpg" alt="img006">
  <img src="img007.jpg" alt="img007">
  <img src="img008.jpg" alt="img008">
  <img src="img009.jpg" alt="img009">
  <img src="img010.jpg" alt="img010">
  <img src="img011.jpg" alt="img011">

  <img src="img018.jpg" alt="img018">
</body>
</html>
